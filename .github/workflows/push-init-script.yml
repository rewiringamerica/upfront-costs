name: Push init script to Databricks volume

on:
  # Note: This occurs with each push to main - no release required.
  push:
    branches:
    - main
  
jobs:
  push-init-script:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    env:
      DATABRICKS_AUTH_TYPE: github-oidc
      DATABRICKS_HOST: https://4617764665359845.5.gcp.databricks.com/
      # This is the ID of the `github-actions` service principal
      DATABRICKS_CLIENT_ID: a97b46fd-8e80-43a6-a918-85d0be954a6d
      BRANCH_NAME: ${{ github.ref_name }}

    steps:
      - uses: actions/checkout@v4

      - name: Databricks CLI Setup
        uses: databricks/setup-cli@main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11

      - name: Get current version from pyproject.toml
        run: |
          pip install toml
          version=$(python -c "import toml; print(toml.load('./pyproject.toml')['tool']['poetry'].get('version', 'no_version_found'))")
          echo "Version found: $version"
          echo "current_version=$version" >> $GITHUB_ENV

      - name: Reformat version number
        run: |
          VERSION_FNAME_FORMAT=v${current_version//./-}
          echo "Updated version to: $VERSION_FNAME_FORMAT"
          echo "version_fname_format=$VERSION_FNAME_FORMAT" >> $GITHUB_ENV

      - name: Push init script to Databricks volume
        run: |
          # Update the latest version
          databricks fs cp install-db-requirements.sh dbfs:/Volumes/dataops/upfront_costs/init_scripts/ --overwrite
          # Also add an explicitly versioned copy
          databricks fs cp install-db-requirements.sh "dbfs:/Volumes/dataops/upfront_costs/init_scripts/install-db-requirements-${{ env.version_fname_format }}.sh" --overwrite