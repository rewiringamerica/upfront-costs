# Databricks Declarative Automation Bundles configuration
#
# This bundle contains a single job, defined in resources/upfront_costs_job.yml.
#
# We use features that require version 1.0.0 or later of the Databricks CLI.
#
# Deploy to dev with
#   databricks bundle deploy --target dev
#
# Delete your dev job with
#   databricks bundle destroy --target dev
#
# Deploy to prod with
#   databricks bundle deploy --target prod

bundle:
  name: upfront_costs
  uuid: e6315d5e-8871-4f61-98bc-e55a64af4407
  engine: direct

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  mode:
    description: The job mode ("main" or "feature")
  env:
    description: Environment ("dev", "prod") used for tagging the job
  git_branch:
    description: The GitHub branch the job runs notebooks from
  email_notifications:
    description: Email notification settings
  webhook_notifications:
    description: Webhook notification settings

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://4617764665359845.5.gcp.databricks.com
      # By default, deploys to /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      mode: feature
      env: dev
      # Run notebooks from the locally checked-out branch (it must be pushed to GitHub)
      git_branch: ${bundle.git.branch}

      # In dev, only send notifications to the owner
      email_notifications:
        type: complex
        default:
          on_start:
            - ${workspace.current_user.userName}
          on_success:
            - ${workspace.current_user.userName}
          on_failure:
            - ${workspace.current_user.userName}

      webhook_notifications:
        type: complex
        default:
          on_start: null
          on_success: null
          on_failure: null

  prod:
    mode: production
    workspace:
      host: https://4617764665359845.5.gcp.databricks.com
      # Deploy to a single shared location
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    variables:
      mode: main
      env: prod
      git_branch: main

      # In prod, send notifications to the team
      email_notifications:
        type: complex
        default:
          on_start: null
          on_success: null
          on_failure:
            - datascience-jobs-notifications@rewiringamerica.org
      webhook_notifications:
        type: complex
        default:
          # data-science-alerts Slack channel
          on_success:
            - id: a671483a-00f0-4e5b-84a4-0aaf986a227e
          on_failure:
            - id: a671483a-00f0-4e5b-84a4-0aaf986a227e

    permissions:
      - group_name: datascience
        level: CAN_MANAGE
      # github-actions service principal can manage the job
      - service_principal_name: a97b46fd-8e80-43a6-a918-85d0be954a6d
        level: CAN_MANAGE
