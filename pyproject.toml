[tool.poetry]
name = "upfront-costs"
version = "1.5.1"
description = "Collecting, standardizing, and analyzing data on the upfront costs of electrification."
package-mode = false
authors = ["Ryan Treves <ryan@rewiringamerica.org>", "Miki Verma <miki@rewiringamerica.org>"]
readme = "README.md"
license = "license.md"

[[tool.poetry.source]]
name = "rewiring-america-python-repo"
url = "https://us-central1-python.pkg.dev/cube-machine-learning/rewiring-america-python-repo/simple/"
priority = "supplemental"

[[tool.poetry.source]]
name = "PyPI"
priority = "primary"

[tool.poetry.dependencies]
python = ">=3.11,<3.12"
usingversion = "^0.1.2"
uvicorn = "^0.17.6"
keyrings-google-artifactregistry-auth = "^1.1.2"
pyahocorasick = "^2.1.0"
selenium = "3.0.0"
pyzmq = ">=25.0.0"
skpro = "^2.10.0"

# From our private repo.
dmlutils = "^1.7.9"
dmlbootstrap = "^0.3.1"

# This is to depend on essentially all the pinned
# versions of things found in the Databricks 15.4 
# runtime. This means this project should only be
# run on 15.4 runtimes, possibly including the ML
# version. The minor .Z version tacked on the end
# is our internal revision number of the cluster 
# libraries.
radbcluster = "==15.4.6"

[tool.poetry.group.dev.dependencies]
black = "^23.0.0"
ruff = "^0.5.5"
pytest = "^8.0.0"
# We need keyring auth to push to our internal artifact repo.
keyring = "^23.0.0"
keyrings-google-artifactregistry-auth = "^1.1.2"
ipykernel = "^6.25.0"
pylint = "^3.3.3"
setuptools = "^68.0.0"
pre-commit = "^4.5.1"

[tool.poetry.group.test.dependencies]
pytest = "^8.0"
coverage = {extras = ["toml"], version = "^7.6.0"}
pytest-cov = "^5.0.0"

[tool.poetry.requires-plugins]
poetry-plugin-export = ">=1.8"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# Linting tools

[tool.black]
line-length = 120

[tool.ruff]
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = ["I", "D", "D213", "D417"] # Sort imports and enforce pydocstyle
extend-ignore = ["D100"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.isort]
# Make sure our packages are grouped together separate from other packages
sections."ra-internal" = ["dmlutils", "dmlbootstrap", "radbcluster"]
# Also group local tools separately
known-first-party = ["src"]
section-order = ["future", "standard-library", "third-party", "ra-internal", "first-party", "local-folder"]

[tool.pytest.ini_options]
pythonpath = [
  "src"
]
